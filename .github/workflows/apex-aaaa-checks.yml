name: Check apex AAAA controller

on:
  pull_request:
    paths:
      - "ops/apex-aaaa/**"
      - ".github/workflows/apex-aaaa*.yml"
  push:
    branches:
      - "dns/apex-aaaa-controller"
    paths:
      - "ops/apex-aaaa/**"
      - ".github/workflows/apex-aaaa*.yml"

permissions:
  contents: read

concurrency:
  group: apex-aaaa-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: ops/apex-aaaa
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install controller dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r ops/apex-aaaa/requirements.txt
      - name: Test decisions and write scope
        run: python -m unittest discover -s ops/apex-aaaa -p 'test_*.py' -v
      - name: Observe public DNS from the hosted runner
        env:
          PYTHONUNBUFFERED: "1"
        run: python ops/apex-aaaa/controller.py
