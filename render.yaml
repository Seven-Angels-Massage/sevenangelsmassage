services:
  - type: web
    runtime: static
    name: sevenangelsmassage
    branch: main
    buildCommand: "true"
    staticPublishPath: ./public

    # Render uses www as the canonical hostname.
    domains:
      - www.sevenangelsmassage.com

    headers:
      - path: "/*"
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: /files/seven-angels-massage.vcf
        name: Content-Type
        value: "text/vcard; charset=utf-8"
      - path: /files/seven-angels-massage.vcf
        name: Content-Disposition
        value: 'attachment; filename="seven-angels-massage.vcf"'
      - path: /files/seven-angels-massage.vcf
        name: Cache-Control
        value: "public, max-age=864000"

    routes:
      # -------- Home normalization --------
      # /home, /home/, /home/jp, /home/kr, /home/cn … → /
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /home/*
        destination: /

      # -------- About us --------
      # /about-us/, /about-us/jp, /about-us/kr, /about-us/cn … → /about-us
      - type: redirect
        source: /about-us/
        destination: /about-us
      - type: redirect
        source: /about-us/*
        destination: /about-us

      # -------- Articles --------
      # /articles/ → /articles
      - type: redirect
        source: /articles/
        destination: /articles

      # -------- Services (homecondo + hotel massage) --------
      # /homecondo-massage*, /hotel-massage* → /services-details
      - type: redirect
        source: /homecondo-massage
        destination: /services-details
      - type: redirect
        source: /homecondo-massage/*
        destination: /services-details
      - type: redirect
        source: /hotel-massage
        destination: /services-details
      - type: redirect
        source: /hotel-massage/*
        destination: /services-details

      # /services-details/ → /services-details
      - type: redirect
        source: /services-details/
        destination: /services-details

      # -------- Contact us --------
      # /contact-us/, /contact-us/jp, /contact-us/kr, /contact-us/cn … → /contact-us
      - type: redirect
        source: /contact-us/
        destination: /contact-us
      - type: redirect
        source: /contact-us/*
        destination: /contact-us

      # -------- Privacy policy --------
      # /privacy-policy/, /privacy-policy/jp, … → /privacy-policy
      - type: redirect
        source: /privacy-policy/
        destination: /privacy-policy
      - type: redirect
        source: /privacy-policy/*
        destination: /privacy-policy

      # -------- Terms & Conditions --------
      # /terms-and-conditions/, /terms-and-conditions/jp, … → /terms-and-conditions
      - type: redirect
        source: /terms-and-conditions/
        destination: /terms-and-conditions
      - type: redirect
        source: /terms-and-conditions/*
        destination: /terms-and-conditions
